name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  # Check wajib "qa": pint, larastan, pest (MySQL 8 + Redis), build aset.
  qa:
    name: qa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quixcode_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd, redis, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Pasang dependensi
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Siapkan lingkungan
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build aset
        run: npm run build

      - name: Pint
        run: composer lint:check

      - name: Larastan
        run: composer types:check

      - name: Pest (Unit + Feature, MySQL)
        run: php artisan test --testsuite=Unit,Feature
        env:
          REDIS_HOST: 127.0.0.1

  # Tes browser 375px: dijalankan di PR tetapi tidak menjadi check wajib.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: qa
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quixcode_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, gd, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
      - run: cp .env.example .env && php artisan key:generate --ansi
      - run: php artisan test --testsuite=Browser

  # Check wajib "security": audit dependensi + pemindai rahasia.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: composer audit
        run: composer audit --locked

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Pemindai rahasia (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
