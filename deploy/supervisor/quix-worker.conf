; Contoh Supervisor untuk Quix Code (T5-09). Sesuaikan path, user, dan jumlah proses.
; Worker A khusus antrean penting: webhook dan pembayaran tidak menunggu email atau PDF.
; Worker B menangani sisanya. `critical` tetap didengar B sebagai cadangan bila A mati.
; Setelah deploy: `php artisan queue:restart`.

[program:quix-critical]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/quix-code/artisan queue:work --queue=critical,default --sleep=1 --tries=5 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/quix-critical.log
stopwaitsecs=3600

[program:quix-background]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/quix-code/artisan queue:work --queue=critical,notifications,pdf,default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/quix-background.log
stopwaitsecs=3600
